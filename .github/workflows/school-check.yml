name: Check school portal
on:
  push:
    branches: [feature/question-bank-sync-2026-11]
    paths:
      - 'render-school/**'
      - 'Dockerfile'
      - '.github/workflows/school-check.yml'
  pull_request:
    branches: [website-o-nha-doc-lap]
permissions:
  contents: read
jobs:
  frontend-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render-school/package-lock.json
      - name: Build frontend
        working-directory: render-school
        run: |
          npm ci
          npm run build
          test -s static/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render-school/requirements.txt
      - name: Test backend
        working-directory: render-school
        run: |
          pip install -r requirements.txt pytest
          python -m py_compile server.py
          pytest -q test_school.py test_school_bank.py test_question_bank.py
      - name: Test frontend modules
        working-directory: render-school
        run: node --test test_exam_bank_ui.mjs test_exam_plan.mjs
