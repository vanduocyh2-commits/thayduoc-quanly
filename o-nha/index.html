<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thầy Được | Lớp học ở nhà</title><style>
:root{--ink:#183b38;--green:#237b65;--muted:#71827d;--line:#e2e9e4;--bg:#f5f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button{border:0;border-radius:9px;padding:10px 16px;background:var(--green);color:white;font-weight:600}button:hover{filter:brightness(.94)}.secondary{background:#eaf0e9;color:var(--ink)}.danger{background:#f8e6e2;color:#a13b30}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.6px}.logo{background:var(--green);color:white;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:25px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--muted)}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;color:#73847d;font-size:14px;padding:12px}nav button.active{background:#e7f0e9;color:#236c55}nav button span{margin-right:12px}.aside-foot{margin-top:auto;font-size:12px;color:var(--muted)}main{padding:26px 42px;max-width:1550px;width:100%;margin:auto;align-self:start}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;gap:16px}header small{color:var(--muted)}.profile{display:flex;align-items:center;gap:12px}.avatar{border-radius:50%;background:#e2eadd;padding:9px 13px;font-weight:700}.welcome{padding:30px 0 22px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:30px;letter-spacing:-1px;line-height:1.25;margin:6px 0 10px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0}p{margin:6px 0 14px}.muted{color:var(--muted);font-size:13px}.hero{background:#e7ede0;border-radius:18px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:25px;overflow:hidden;margin-bottom:24px}.hero h2{font-size:25px;letter-spacing:-.7px;max-width:480px}.hero-art{font-size:70px;transform:rotate(-10deg);padding:0 25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.stat strong{font-size:31px;display:block;line-height:1.4}.stat small{color:var(--muted)}.stat-icon{float:right;background:#f1f5ee;padding:8px;border-radius:10px}.columns{display:grid;grid-template-columns:1.7fr 1fr;gap:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.listrow{border-top:1px solid var(--line);padding:17px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}.pill{background:#e9f2eb;color:#358061;border-radius:30px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap}.pill.amber{background:#fcf1d9;color:#9d7829}.class-icon{width:43px;height:43px;border-radius:10px;background:#f2eee2;display:grid;place-items:center;font-size:19px}.group{display:flex;gap:13px;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.empty{padding:30px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.notice{font-size:12px;color:#7c755f;background:#f4f0e4;padding:9px 14px;border-radius:8px;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.scroll{overflow:auto}input,select,textarea{border:1px solid #d6dfd8;background:white;padding:10px 12px;border-radius:8px;width:100%;color:var(--ink)}textarea{min-height:110px}label{display:grid;gap:6px;font-size:13px;font-weight:600;margin:12px 0}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}dialog{border:0;border-radius:18px;padding:28px;width:min(580px,94vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:#16382c70}dialog h2{margin-bottom:18px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 24px;border-radius:10px;z-index:20}.auth{max-width:960px;margin:9vh auto;padding:20px;display:grid;grid-template-columns:1fr 1fr}.auth-intro{padding:48px;background:#e5eddf;border-radius:20px 0 0 20px}.auth-form{padding:40px;background:white;border-radius:0 20px 20px 0;border:1px solid var(--line)}.auth-intro h1{font-size:40px;margin-top:45px}.auth-form .toolbar button{flex:1}.badge{background:#d5894c;color:white;border-radius:20px;padding:1px 6px;font-size:10px;margin-left:6px}.question{background:#f5f7f2;padding:15px;border-radius:9px;margin:16px 0}.question label{display:flex;align-items:center;font-weight:400}.question input{width:auto}a{color:var(--green)}footer{color:var(--muted);font-size:11px;margin-top:30px}.hidden{display:none!important}@media(max-width:1050px){.app{grid-template-columns:190px 1fr}aside{padding:24px 14px}main{padding:24px}.columns{grid-template-columns:1fr}.stats{gap:10px}.card{padding:17px}.hero-art{display:none}}@media(max-width:700px){.app{display:block}aside{border-right:0;padding:16px;gap:15px}.aside-foot{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:20px 16px}header .avatar,header small{display:none}.stats{grid-template-columns:1fr 1fr}.welcome{align-items:flex-start}h1{font-size:26px}.hero{padding:22px}.auth{display:block;margin:20px auto}.auth-intro{border-radius:16px 16px 0 0;padding:24px}.auth-intro h1{font-size:30px;margin-top:20px}.auth-form{border-radius:0 0 16px 16px;padding:24px}.fieldrow{grid-template-columns:1fr}.profile{font-size:12px}.welcome button{font-size:12px}}
</style></head><body><div id="root"></div><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const KEY='thayduoc_home_independent_v1',SESSION='thayduoc_home_session_v1';
const fresh=()=>({classes:[],students:[],assignments:[],submissions:[],attendance:[],grades:[],schedule:[],messages:[],teacher:{name:'Thầy Bùi Văn Được',username:'giaovien',password:'123456'}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
let session;try{session=JSON.parse(sessionStorage.getItem(SESSION))}catch{}let page='overview',authRole='teacher';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}),fmt=x=>x?new Date(x).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',dateStyle:'short',timeStyle:'short'}):'Không giới hạn',teacher=()=>session?.role==='teacher',me=()=>db.students.find(s=>s.id===session?.id),className=id=>db.classes.find(c=>c.id===id)?.name||'Lớp đã xóa';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Chưa lưu được: bộ nhớ trình duyệt đã đầy. Hãy sao lưu.');return false}}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function options(list,value='id',label='name'){return list.map(x=>`<option value="${esc(x[value])}">${esc(x[label])}</option>`).join('')}
function modal(title,html,submit){const m=$('modal');m.innerHTML=`<form id="form"><h2>${esc(title)}</h2>${html}<div class="actions"><button type="button" class="secondary" id="cancel">Hủy</button><button type="submit">Lưu</button></div></form>`;$('cancel').onclick=()=>m.close();$('form').onsubmit=async e=>{e.preventDefault();try{if(await submit(new FormData(e.target))!==false){m.close();save();render()}}catch(err){toast(err.message||'Không lưu được.')}};m.showModal()}
function field(label,name,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function logout(){session=null;sessionStorage.removeItem(SESSION);render()}
function auth(){const r=authRole;return `<div class="auth"><section class="auth-intro"><div class="brand"><span class="logo">↗</span> THẦY ĐƯỢC</div><h1>Một lớp học.<br>Nhiều điều mới.</h1><p>Cùng học, cùng tiến bộ mỗi ngày.</p><p class="muted">Không gian dạy học ở nhà<br>Dành cho giáo viên và học sinh</p><div style="font-size:75px;margin-top:35px">📚</div></section><section class="auth-form"><div class="eyebrow">CHÀO MỪNG TRỞ LẠI</div><h2 style="font-size:27px;margin-top:12px">Vào lớp học của bạn</h2><div class="toolbar"><button class="${r==='teacher'?'':'secondary'}" onclick="authRole='teacher';render()">Giáo viên</button><button class="${r==='student'?'':'secondary'}" onclick="authRole='student';render()">Học sinh</button></div><form id="login">${r==='student'?`<label>Lớp học<select name="classId" required><option value="">Chọn lớp</option>${options(db.classes)}</select></label>`:''}${field(r==='teacher'?'Tên đăng nhập':'Mã học sinh','username','text','', 'required autocomplete="username"')}${field('Mật khẩu','password','password','','required autocomplete="current-password"')}<button style="width:100%;margin-top:12px">Đăng nhập →</button></form><p class="muted" style="margin-top:20px">${r==='teacher'?'Lần đầu sử dụng: giaovien / 123456. Đổi mật khẩu trong Cài đặt.':'Nhận mã học sinh và mật khẩu từ giáo viên.'}</p><div class="notice">Bản riêng để dạy học ở nhà. Dữ liệu hiện lưu trên trình duyệt này, chưa đồng bộ giữa các thiết bị.</div></section></div>`}
const nav=[['overview','◫','Tổng quan'],['classes','▦','Lớp học'],['assignments','▤','Bài tập & kiểm tra'],['attendance','✓','Điểm danh'],['grades','▥','Bảng điểm'],['schedule','▣','Lịch học'],['messages','✉','Trao đổi'],['settings','⚙','Cài đặt']];
function unread(){return db.messages.filter(m=>!m.read&&(teacher()?m.from!=='teacher':m.to===me()?.id)).length}
function render(){if(session&&!teacher()&&!me())session=null;if(!session){$('root').innerHTML=auth();$('login').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=f.get('username').trim(),p=f.get('password');if(authRole==='teacher'&&u===db.teacher.username&&p===db.teacher.password)session={role:'teacher'};else if(authRole==='student'){const s=db.students.find(s=>s.classId===f.get('classId')&&s.code===u&&s.password===p);if(s)session={role:'student',id:s.id}}if(!session)return toast('Thông tin đăng nhập chưa đúng.');sessionStorage.setItem(SESSION,JSON.stringify(session));page='overview';render()};return}
$('root').innerHTML=`<div class="app"><aside><div class="brand"><span class="logo">↗</span>THẦY ĐƯỢC</div><div><div class="eyebrow" style="padding:0 12px 12px">KHÔNG GIAN HỌC TẬP</div><nav>${nav.filter(n=>teacher()||!['settings'].includes(n[0])).map(([id,i,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${i}</span>${t}${id==='messages'&&unread()?`<b class="badge">${unread()}</b>`:''}</button>`).join('')}</nav></div><div class="aside-foot"><b>NĂM HỌC 2026 – 2027</b><p>Dạy học ở nhà</p><button class="secondary" onclick="logout()">Đăng xuất ↗</button></div></aside><main><header><div class="eyebrow">Ở NHÀ / ${nav.find(n=>n[0]===page)?.[2]}</div><div class="profile"><small>${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Ho_Chi_Minh'})}</small><span class="avatar">${teacher()?'Đ':esc(me().name.slice(0,1))}</span><b>${esc(teacher()?db.teacher.name:me().name)}</b><button class="secondary" onclick="logout()" title="Đăng xuất">↗</button></div></header><div class="welcome"><div><div class="eyebrow">${teacher()?'DẠY HỌC & KẾT NỐI':'HỌC TẬP & KHÁM PHÁ'}</div><h1>${page==='overview'?(teacher()?'Chào thầy, một ngày tốt lành!':'Sẵn sàng cho bài học mới?'):nav.find(n=>n[0]===page)?.[2]}</h1><span class="muted">${page==='overview'?'Theo dõi lớp học và những việc cần làm hôm nay.':'Không gian riêng cho việc dạy và học ở nhà.'}</span></div>${teacher()&&page==='overview'?'<button onclick="addAssignment()">＋ Giao bài mới</button>':''}</div><section id="content">${content()}</section><footer>THẦY ĐƯỢC · LỚP HỌC Ở NHÀ <span style="float:right">Dữ liệu lưu trên thiết bị này</span></footer></main></div>`;bind()}
function go(p){page=p;render()}
function visibleAssignments(){return db.assignments.filter(a=>teacher()||a.classId===me().classId)}
function mineSub(a){return db.submissions.find(s=>s.assignmentId===a.id&&s.studentId===me()?.id)}
function assignmentRow(a){let sub=teacher()?null:mineSub(a);return `<div class="listrow"><div class="group"><div class="class-icon">${a.kind==='quiz'?'✎':'▤'}</div><div><b>${esc(a.title)}</b><div class="muted">${esc(className(a.classId))} · ${a.kind==='quiz'?'Trắc nghiệm':'Tự luận'} · Hạn: ${fmt(a.due)}</div></div></div><button class="secondary" onclick="openAssignment('${a.id}')">${teacher()?'Chi tiết':sub?'Xem kết quả':'Làm bài'} →</button></div>`}
function content(){if(page==='overview'){const as=visibleAssignments(),cls=teacher()?db.classes:db.classes.filter(c=>c.id===me().classId);return `<div class="hero"><div><div class="eyebrow">MỖI NGÀY MỘT BƯỚC TIẾN</div><h2>Kiến thức được kết nối.<br>Tiến bộ được ghi nhận.</h2><p class="muted">Từ bài giảng đến bài tập, mọi hoạt động trong một không gian.</p><button onclick="go('assignments')">${teacher()?'Quản lý bài tập':'Khám phá bài học'} →</button></div><div class="hero-art" aria-hidden="true">📖</div></div><div class="stats">${[[cls.length,'Lớp học','▦'],[teacher()?db.students.length:as.length,teacher()?'Học sinh':'Bài được giao','♙'],[teacher()?db.submissions.filter(s=>s.score===null).length:as.filter(a=>!mineSub(a)).length,teacher()?'Bài chờ chấm':'Bài chưa hoàn thành','▤'],[unread(),'Tin nhắn chưa đọc','✉']].map(([n,t,i])=>`<div class="card stat"><span class="stat-icon">${i}</span><small>${t}</small><strong>${n.toString().padStart(2,'0')}</strong><small>Cập nhật từ lớp học của bạn</small></div>`).join('')}</div><div class="columns"><div class="card"><div class="row"><h2>Bài tập gần đây</h2><button class="secondary" onclick="go('assignments')">Xem tất cả ↗</button></div>${as.slice(-4).reverse().map(assignmentRow).join('')||'<div class="empty">Chưa có bài tập. Bắt đầu bằng một bài học mới.</div>'}</div><div class="card"><div class="row"><h2>Lớp học của bạn</h2><span class="pill">${cls.length} lớp</span></div>${cls.map(c=>`<div class="listrow"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.subject)} · ${db.students.filter(s=>s.classId===c.id).length} học sinh</div></div><button class="secondary" onclick="showClass('${c.id}')">→</button></div>`).join('')||'<div class="empty">Tạo lớp để bắt đầu năm học.</div>'}${teacher()?'<button style="width:100%;margin-top:14px" class="secondary" onclick="addClass()">＋ Thêm lớp học</button>':''}</div></div>`}
if(page==='classes')return `<div class="toolbar">${teacher()?'<button onclick="addClass()">＋ Tạo lớp</button><button class="secondary" onclick="addStudent()">＋ Thêm học sinh</button>':''}</div><div class="card">${(teacher()?db.classes:db.classes.filter(c=>c.id===me().classId)).map(c=>`<div class="listrow"><div class="group"><div class="class-icon">▦</div><div><h3>${esc(c.name)}</h3><span class="muted">${esc(c.subject)} · ${db.students.filter(s=>s.classId===c.id).length} học sinh</span></div></div><div><button class="secondary" onclick="showClass('${c.id}')">Mở lớp →</button> ${teacher()?`<button class="secondary" onclick="addClass('${c.id}')">Sửa</button>`:''}</div></div>`).join('')||'<div class="empty">Chưa có lớp học.</div>'}</div>`;
if(page==='assignments')return `<div class="toolbar">${teacher()?'<button onclick="addAssignment()">＋ Giao bài / Tạo kiểm tra</button>':''}</div><div class="card">${visibleAssignments().slice().reverse().map(assignmentRow).join('')||'<div class="empty">Chưa có bài tập được giao.</div>'}</div>`;
if(page==='attendance')return attendanceView();if(page==='grades')return gradesView();if(page==='schedule')return scheduleView();if(page==='messages')return messagesView();if(page==='settings')return settingsView();return ''}
function addClass(id){if(!teacher())return;const c=db.classes.find(c=>c.id===id)||{};modal(id?'Chỉnh sửa lớp':'Tạo lớp học',field('Tên lớp','name','text',c.name,'required maxlength="60"')+field('Môn học','subject','text',c.subject,'required maxlength="80"'),f=>{const name=f.get('name').trim();if(!name)return false;if(db.classes.some(x=>x.id!==id&&x.name===name))return toast('Tên lớp đã tồn tại.'),false;if(id)Object.assign(c,{name,subject:f.get('subject').trim()});else db.classes.push({id:uid(),name,subject:f.get('subject').trim()})})}
function addStudent(classId){if(!teacher())return;if(!db.classes.length)return toast('Hãy tạo lớp trước.');modal('Thêm học sinh',`<label>Lớp<select name="classId">${options(db.classes)}</select></label>`+field('Họ và tên','name','text','','required maxlength="100"')+field('Mã học sinh','code','text','','required pattern="[A-Za-z0-9_.-]+"')+field('Mật khẩu','password','password','','required minlength="6"'),f=>{if(db.students.some(s=>s.classId===f.get('classId')&&s.code===f.get('code')))return toast('Mã học sinh đã có trong lớp.'),false;db.students.push({id:uid(),classId:f.get('classId'),name:f.get('name').trim(),code:f.get('code'),password:f.get('password')})});if(classId)$('form').elements.classId.value=classId}
function showClass(id){const c=db.classes.find(c=>c.id===id);if(!c||(!teacher()&&me().classId!==id))return;const ss=db.students.filter(s=>s.classId===id&&(teacher()||s.id===me().id));modal('Lớp '+c.name,`<p class="muted">${esc(c.subject)}</p><div class="scroll"><table><thead><tr><th>Mã HS</th><th>Họ tên</th>${teacher()?'<th>Thao tác</th>':''}</tr></thead><tbody>${ss.map(s=>`<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td>${teacher()?`<td><button type="button" class="secondary" onclick="resetStudent('${s.id}')">Đổi MK</button> <button type="button" class="danger" onclick="removeStudent('${s.id}')">Xóa</button></td>`:''}</tr>`).join('')}</tbody></table></div>${!ss.length?'<p class="empty">Lớp chưa có học sinh.</p>':''}`,()=>{});$('form').querySelector('[type=submit]').style.display='none';$('cancel').textContent='Đóng'}
function resetStudent(id){if(!teacher())return;const p=prompt('Mật khẩu mới (ít nhất 6 ký tự):');if(p&&p.length>=6){db.students.find(s=>s.id===id).password=p;save();toast('Đã đổi mật khẩu.')}else if(p)toast('Mật khẩu cần ít nhất 6 ký tự.')}
function removeStudent(id){if(!teacher()||!confirm('Xóa học sinh và các điểm, bài nộp, điểm danh liên quan?'))return;db.students=db.students.filter(s=>s.id!==id);for(const k of ['submissions','attendance','grades'])db[k]=db[k].filter(x=>x.studentId!==id);db.messages=db.messages.filter(x=>x.from!==id&&x.to!==id);save();$('modal').close();render()}
function addAssignment(id){if(!teacher())return;if(!db.classes.length)return toast('Hãy tạo lớp trước.');const a=db.assignments.find(a=>a.id===id)||{};modal(id?'Sửa bài tập':'Giao bài mới',field('Tiêu đề','title','text',a.title,'required maxlength="160"')+`<div class="fieldrow"><label>Lớp<select name="classId">${options(db.classes)}</select></label><label>Hình thức<select name="kind"><option value="essay">Tự luận</option><option value="quiz">Trắc nghiệm</option></select></label></div>`+field('Hạn nộp (có thể để trống)','due','datetime-local',a.due)+`<label>Nội dung / hướng dẫn<textarea name="body" required>${esc(a.body||'')}</textarea></label>`+field('Đường dẫn tài liệu (không bắt buộc)','url','url',a.url)+`<label>Câu hỏi trắc nghiệm<textarea name="questions" placeholder="Mỗi dòng: Câu hỏi | Đáp án A | Đáp án B | Đáp án C | Đáp án D | A">${esc(a.questions?.map(q=>[q.text,...q.answers,'ABCD'[q.correct]].join(' | ')).join('\n')||'')}</textarea></label><p class="muted">Nếu chọn trắc nghiệm, nhập mỗi câu trên một dòng theo mẫu. Điểm tự chấm theo thang 10.</p>`,f=>{let questions=[];if(f.get('kind')==='quiz'){questions=f.get('questions').split('\n').filter(x=>x.trim()).map(l=>{const p=l.split('|').map(s=>s.trim());if(p.length!==6||p.slice(0,5).some(x=>!x)||!['A','B','C','D'].includes(p[5].toUpperCase()))throw Error('Kiểm tra định dạng câu hỏi: 6 phần, ngăn bằng | và đáp án A–D.');return {text:p[0],answers:p.slice(1,5),correct:'ABCD'.indexOf(p[5].toUpperCase())}});if(!questions.length)throw Error('Cần ít nhất một câu hỏi.')}if(id&&db.submissions.some(s=>s.assignmentId===id))throw Error('Bài đã có học sinh nộp. Hãy tạo bài mới để giữ đúng kết quả.');const next={id:id||uid(),title:f.get('title').trim(),classId:f.get('classId'),kind:f.get('kind'),due:f.get('due'),body:f.get('body'),url:f.get('url'),questions};if(id)Object.assign(a,next);else db.assignments.push(next)});if(id){$('form').elements.classId.value=a.classId;$('form').elements.kind.value=a.kind}}
function openAssignment(id){const a=visibleAssignments().find(a=>a.id===id);if(!a)return;let sub=mineSub(a);const late=a.due&&Date.now()>new Date(a.due).getTime();let html=`<p class="muted">${esc(className(a.classId))} · Hạn nộp: ${fmt(a.due)}</p><p style="white-space:pre-wrap">${esc(a.body)}</p>${a.url&&/^https?:\/\//.test(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Mở tài liệu ↗</a>`:''}`;
if(teacher()){html+=`<div class="toolbar" style="margin-top:16px"><button type="button" class="secondary" onclick="$('modal').close();addAssignment('${id}')">Sửa bài</button><button type="button" class="danger" onclick="deleteAssignment('${id}')">Xóa bài</button></div><h3>Bài đã nộp</h3>${db.submissions.filter(s=>s.assignmentId===id).map(s=>`<div class="listrow"><div><b>${esc(db.students.find(x=>x.id===s.studentId)?.name||'Học sinh đã xóa')}</b><p class="muted">${s.score===null?'Chờ chấm':s.score+'/10'} · ${fmt(s.at)}</p></div><button type="button" class="secondary" onclick="gradeSubmission('${s.id}')">Xem / Chấm</button></div>`).join('')||'<p class="muted">Chưa có bài nộp.</p>'}`;modal(a.title,html,()=>{});$('form').querySelector('[type=submit]').style.display='none';return}
if(sub){html+=`<div class="question"><b>${sub.score===null?'Giáo viên đang chấm bài':'Điểm: '+sub.score+'/10'}</b><p>${esc(sub.feedback||'')}</p><p style="white-space:pre-wrap">${esc(sub.text||'')}</p><small>Đã nộp ${fmt(sub.at)}</small></div>`;modal(a.title,html,()=>{});$('form').querySelector('[type=submit]').style.display='none';return}
if(late){modal(a.title,html+'<p class="notice">Đã hết hạn nộp bài.</p>',()=>{});$('form').querySelector('[type=submit]').style.display='none';return}
html+=a.kind==='quiz'?a.questions.map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${esc(q.text)}</legend>${q.answers.map((t,j)=>`<label><input type="radio" name="q${i}" value="${j}" required>${'ABCD'[j]}. ${esc(t)}</label>`).join('')}</fieldset>`).join(''):`<label>Bài làm của em<textarea name="text" required rows="9"></textarea></label>`;
modal(a.title,html,f=>{if(a.due&&Date.now()>new Date(a.due).getTime())return toast('Đã hết hạn nộp.'),false;if(mineSub(a))return false;const answers=a.questions.map((q,i)=>Number(f.get('q'+i)));db.submissions.push({id:uid(),assignmentId:id,studentId:me().id,text:f.get('text')||'',answers,score:a.kind==='quiz'?Math.round(answers.filter((v,i)=>v===a.questions[i].correct).length/a.questions.length*100)/10:null,feedback:'',at:new Date().toISOString()});toast('Đã nộp bài.');});$('form').querySelector('[type=submit]').textContent='Nộp bài'}
function deleteAssignment(id){if(!teacher()||!confirm('Xóa bài và toàn bộ bài nộp liên quan?'))return;db.assignments=db.assignments.filter(a=>a.id!==id);db.submissions=db.submissions.filter(s=>s.assignmentId!==id);save();$('modal').close();render()}
function gradeSubmission(id){if(!teacher())return;const s=db.submissions.find(s=>s.id===id),a=db.assignments.find(a=>a.id===s.assignmentId);$('modal').close();modal('Chấm bài — '+a.title,`<p style="white-space:pre-wrap">${esc(s.text)}</p>${a.kind==='quiz'?a.questions.map((q,i)=>`<p>${esc(q.text)}<br><small>Đã chọn: ${esc(q.answers[s.answers[i]]||'Chưa trả lời')} · Đáp án: ${esc(q.answers[q.correct])}</small></p>`).join(''):''}`+field('Điểm (0–10)','score','number',s.score??'','required min="0" max="10" step="0.1"')+`<label>Nhận xét<textarea name="feedback">${esc(s.feedback)}</textarea></label>`,f=>{s.score=Number(f.get('score'));s.feedback=f.get('feedback')})}
function attendanceView(){const cls=teacher()?db.classes:db.classes.filter(c=>c.id===me().classId);return `<div class="card">${teacher()?`<div class="toolbar"><select id="att-class" style="max-width:220px">${options(cls)}</select><input id="att-date" type="date" value="${today()}" style="max-width:200px"><button onclick="drawAttendance()">Xem danh sách</button><button class="secondary" onclick="saveAttendance()">Lưu điểm danh</button></div><div id="att-list"></div>`:`<h2>Lịch sử điểm danh</h2>${db.attendance.filter(a=>a.studentId===me().id).sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="listrow"><b>${esc(a.date)}</b><span class="pill">${esc(a.status)}</span></div>`).join('')||'<div class="empty">Chưa có điểm danh.</div>'}`}</div>`}
function drawAttendance(){if(!teacher()||!$('att-class'))return;const cid=$('att-class').value,d=$('att-date').value;$('att-list').innerHTML=`<table><thead><tr><th>Mã HS</th><th>Học sinh</th><th>Trạng thái</th></tr></thead><tbody>${db.students.filter(s=>s.classId===cid).map(s=>{const v=db.attendance.find(a=>a.studentId===s.id&&a.date===d)?.status||'Có mặt';return `<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td><select data-att="${s.id}">${['Có mặt','Vắng có phép','Vắng không phép','Đi muộn','Học bù'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table>`}
function saveAttendance(){if(!teacher())return;const date=$('att-date').value;if(!date)return toast('Chọn ngày điểm danh.');const entries=[...document.querySelectorAll('[data-att]')];if(!entries.length)return toast('Lớp chưa có học sinh.');for(const e of entries){db.attendance=db.attendance.filter(a=>!(a.studentId===e.dataset.att&&a.date===date));db.attendance.push({studentId:e.dataset.att,date,status:e.value})}save();toast('Đã lưu điểm danh.');}
function gradeRows(){const manual=db.grades.map(g=>({...g,title:g.title})),auto=db.submissions.filter(s=>s.score!==null).map(s=>({...s,title:db.assignments.find(a=>a.id===s.assignmentId)?.title||'Bài tập'}));return [...manual,...auto].filter(g=>teacher()||g.studentId===me().id)}
function gradesView(){const gs=gradeRows();return `<div class="toolbar">${teacher()?'<button onclick="addGrade()">＋ Nhập điểm</button>':''}<button class="secondary" onclick="exportGrades()">↓ Xuất bảng điểm CSV (Excel)</button></div><div class="card scroll"><table><thead><tr>${teacher()?'<th>Học sinh</th><th>Lớp</th>':''}<th>Bài / Cột điểm</th><th>Điểm / 10</th><th>Nhận xét</th></tr></thead><tbody>${gs.map(g=>{const s=db.students.find(s=>s.id===g.studentId);return `<tr>${teacher()?`<td>${esc(s?.name)}</td><td>${esc(className(s?.classId))}</td>`:''}<td>${esc(g.title)}</td><td><b>${g.score}</b></td><td>${esc(g.feedback||'—')}</td></tr>`}).join('')}</tbody></table>${!gs.length?'<div class="empty">Chưa có điểm được công bố.</div>':''}</div>`}
function addGrade(){if(!teacher())return;if(!db.students.length)return toast('Hãy thêm học sinh trước.');modal('Nhập điểm',`<label>Học sinh<select name="studentId">${db.students.map(s=>`<option value="${s.id}">${esc(className(s.classId)+' · '+s.name+' · '+s.code)}</option>`).join('')}</select></label>`+field('Tên bài / cột điểm','title','text','','required')+field('Điểm','score','number','','required min="0" max="10" step="0.1"')+field('Nhận xét','feedback'),f=>db.grades.push({id:uid(),studentId:f.get('studentId'),title:f.get('title'),score:Number(f.get('score')),feedback:f.get('feedback')}))}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportGrades(){const cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['Học sinh','Lớp','Bài / Cột điểm','Điểm','Nhận xét'],...gradeRows().map(g=>{const s=db.students.find(s=>s.id===g.studentId);return [s?.name,className(s?.classId),g.title,g.score,g.feedback]})];download('bang-diem.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function scheduleView(){const ls=db.schedule.filter(s=>teacher()||s.classId===me().classId).slice().sort((a,b)=>a.at.localeCompare(b.at));return `<div class="toolbar">${teacher()?'<button onclick="addSchedule()">＋ Thêm lịch học</button>':''}</div><div class="card">${ls.map(s=>`<div class="listrow"><div><h3>${esc(s.title)}</h3><p class="muted">${esc(className(s.classId))} · ${fmt(s.at)} · ${esc(s.room)}</p></div>${teacher()?`<button class="danger" onclick="removeSchedule('${s.id}')">Xóa</button>`:'<span class="pill">Lịch học</span>'}</div>`).join('')||'<div class="empty">Chưa có lịch học.</div>'}</div>`}
function addSchedule(){if(!teacher())return;if(!db.classes.length)return toast('Hãy tạo lớp trước.');modal('Thêm lịch học',field('Nội dung buổi học','title','text','','required')+`<label>Lớp<select name="classId">${options(db.classes)}</select></label>`+field('Ngày giờ','at','datetime-local','','required')+field('Phòng / địa điểm','room','text','','required'),f=>db.schedule.push({id:uid(),title:f.get('title'),classId:f.get('classId'),at:f.get('at'),room:f.get('room')}))}
function removeSchedule(id){if(!teacher()||!confirm('Xóa lịch học này?'))return;db.schedule=db.schedule.filter(s=>s.id!==id);save();render()}
function visibleMessages(){return db.messages.filter(m=>teacher()||m.from===me().id||m.to===me().id)}
function messagesView(){return `<div class="toolbar"><button onclick="sendMessage()">＋ ${teacher()?'Gửi thông báo / phản hồi':'Nhắn giáo viên'}</button><button class="secondary" onclick="markMessages()">Đánh dấu đã đọc</button></div><div class="card">${visibleMessages().slice().reverse().map(m=>`<div class="listrow"><div><b>${esc(m.title)}${!m.read&&(teacher()?m.from!=='teacher':m.to===me().id)?'<span class="badge">Mới</span>':''}</b><div class="muted">${m.from==='teacher'?'Giáo viên':esc(db.students.find(s=>s.id===m.from)?.name||'Học sinh')} → ${m.to==='teacher'?'Giáo viên':esc(db.students.find(s=>s.id===m.to)?.name||'Học sinh')} · ${fmt(m.at)}</div><p style="white-space:pre-wrap">${esc(m.body)}</p></div>${teacher()?`<button class="danger" onclick="removeMessage('${m.id}')">Xóa</button>`:''}</div>`).join('')||'<div class="empty">Chưa có trao đổi.</div>'}</div>`}
function sendMessage(){if(teacher()&&!db.students.length)return toast('Hãy thêm học sinh trước.');modal(teacher()?'Gửi tới học sinh':'Gửi tới giáo viên',`${teacher()?`<label>Người nhận<select name="to"><option value="all">Tất cả học sinh</option>${db.students.map(s=>`<option value="${s.id}">${esc(className(s.classId)+' · '+s.name)}</option>`).join('')}</select></label>`:''}`+field('Tiêu đề','title','text','','required maxlength="160"')+`<label>Nội dung<textarea name="body" required maxlength="4000"></textarea></label>`,f=>{const tos=teacher()?(f.get('to')==='all'?db.students.map(s=>s.id):[f.get('to')]):['teacher'];for(const to of tos)db.messages.push({id:uid(),from:teacher()?'teacher':me().id,to,title:f.get('title'),body:f.get('body'),read:false,at:new Date().toISOString()});toast('Đã gửi. Dữ liệu hiện lưu trên trình duyệt này.');})}
function markMessages(){visibleMessages().forEach(m=>{if(teacher()?m.to==='teacher':m.to===me().id)m.read=true});save();render()}
function removeMessage(id){if(!teacher()||!confirm('Xóa trao đổi này?'))return;db.messages=db.messages.filter(m=>m.id!==id);save();render()}
function settingsView(){if(!teacher())return '';return `<div class="columns"><div class="card"><h2>Tài khoản giáo viên</h2><p class="muted">Đổi mật khẩu mặc định trước khi nhập dữ liệu thật.</p><form id="teacher-settings">${field('Tên hiển thị','name','text',db.teacher.name,'required')}${field('Tên đăng nhập','username','text',db.teacher.username,'required minlength="3"')}${field('Mật khẩu hiện tại','old','password','','required')}${field('Mật khẩu mới (bỏ trống để giữ nguyên)','password','password','','minlength="6"')}<button>Lưu tài khoản</button></form></div><div class="card"><h2>Dữ liệu riêng của bản ở nhà</h2><p class="muted">Bản này có tài khoản và dữ liệu độc lập với bản trung tâm. Dữ liệu đang lưu trên trình duyệt của thiết bị này. Chưa có kết nối để giáo viên và học sinh dùng chung qua Internet.</p><div class="toolbar"><button onclick="backup()">↓ Sao lưu dữ liệu</button><button class="secondary" onclick="$('restore').click()">↑ Khôi phục</button><input id="restore" type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)"></div><div class="notice">Tệp sao lưu chứa tài khoản, mật khẩu và dữ liệu lớp. Chỉ lưu giữ ở nơi riêng tư. Khôi phục sẽ thay toàn bộ dữ liệu của bản ở nhà.</div></div></div>`}
function backup(){if(teacher())download('thayduoc-o-nha-'+today()+'.json',JSON.stringify({format:'thayduoc-home-v1',data:db},null,2),'application/json')}
async function restoreBackup(input){if(!teacher())return;try{const f=input.files[0];if(!f)return;if(f.size>10e6)throw Error('Tệp tối đa 10 MB.');const b=JSON.parse(await f.text()),d=b.data,keys=['classes','students','assignments','submissions','attendance','grades','schedule','messages'];if(b.format!=='thayduoc-home-v1'||!d||keys.some(k=>!Array.isArray(d[k]))||typeof d.teacher?.username!=='string'||typeof d.teacher?.password!=='string')throw Error('Tệp sao lưu không hợp lệ.');for(const k of keys)if(d[k].some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw Error('Dữ liệu không hợp lệ.');for(const s of d.students)if(typeof s.name!=='string'||typeof s.code!=='string'||typeof s.password!=='string')throw Error('Dữ liệu học sinh không hợp lệ.');for(const a of d.assignments)if(!Array.isArray(a.questions))throw Error('Dữ liệu bài tập không hợp lệ.');if(!confirm('Thay toàn bộ dữ liệu bản ở nhà bằng bản sao lưu?'))return;const old=db;db=d;if(!save()){db=old;return}logout();toast('Đã khôi phục. Đăng nhập bằng tài khoản trong bản sao lưu.')}catch(e){toast(e.message)}finally{input.value=''}}
function bind(){if(page==='attendance'&&teacher()){drawAttendance();$('att-class').onchange=drawAttendance;$('att-date').onchange=drawAttendance}if(page==='settings'&&teacher())$('teacher-settings').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('old')!==db.teacher.password)return toast('Mật khẩu hiện tại chưa đúng.');db.teacher.name=f.get('name').trim();db.teacher.username=f.get('username').trim();if(f.get('password'))db.teacher.password=f.get('password');save();render();toast('Đã lưu tài khoản.')}}
window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||fresh();render()}catch{}}});render();
</script></body></html>
